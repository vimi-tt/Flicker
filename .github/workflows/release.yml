name: Release (AppImage & CLI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build & AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libfuse2 \
            imagemagick \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine release version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            VER=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build GUI + CLI release binary
        run: cargo build --release

      - name: Download appimagetool
        run: |
          wget -qO target/appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x target/appimagetool-x86_64.AppImage

      - name: Build AppImage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SKIP_BUILD: "1"
          APPIMAGETOOL: ./target/appimagetool-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash packaging/appimage/build-appimage.sh

      - name: Build lightweight CLI-only tarball
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cargo build --release --no-default-features --target-dir target-cli
          mkdir -p dist
          tar -czf "dist/flicker-${VERSION}-x86_64-linux-cli.tar.gz" -C target-cli/release flicker
          sha256sum "dist/flicker-${VERSION}-x86_64-linux-cli.tar.gz" > "dist/flicker-${VERSION}-x86_64-linux-cli.tar.gz.sha256"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flicker-linux-release
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
