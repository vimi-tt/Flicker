[package]
name = "flicker"
version = "1.0.0"
edition = "2021"
authors = ["Vitor Miranda"]
description = "A modern, fast, and safe USB bootable drive creator for Linux"
readme = "README.md"
license = "MIT"
keywords = ["usb", "bootable", "iso", "rufus", "linux"]
categories = ["command-line-utilities", "hardware-support"]
rust-version = "1.85"

[features]
default = ["gui"]
gui = ["dep:slint", "dep:rfd"]

[[bin]]
name = "flicker"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.59", features = ["derive"] }
indicatif = "0.18.4"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
libc = "0.2.182"
md-5 = "0.10.6"
slint = { version = "1.5.1", default-features = false, features = ["backend-winit", "renderer-femtovg", "std", "compat-1-2", "accessibility"], optional = true }
rfd = { version = "0.17.2", optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[build-dependencies]
slint-build = "1.5.1"
